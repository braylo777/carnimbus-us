<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Your Top Matches</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:100dvh;display:flex;flex-direction:column">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z col" style="flex:1;min-height:0" id="m-split">
      <div style="flex:none;border-bottom:1px solid rgba(24,200,255,.12);padding:12px 16px">
        <div id="m-gate" style="display:none;align-items:center;gap:10px;margin-bottom:10px;padding:11px 14px;border:1px dashed rgba(24,200,255,.35);border-radius:12px;font:600 12px Manrope;color:#aebfdf">Finish your profile to unlock matches. <a class="cy" href="/edit-profile">Answer a few questions →</a></div>
        <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:8px">NEW MATCHES</div>
        <div id="m-new" style="display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px"></div>
      </div>
      <div class="row" style="flex:1;min-height:0" id="m-lower">
        <div id="m-list" style="flex:1;min-width:0;overflow-y:auto;padding:14px;min-height:0">
          <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:9px">CONVERSATIONS</div>
          <div id="m-threads" class="col" style="gap:8px"></div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js?v=3" defer></script>
<script src="/assets/js/matches.js?v=5" defer></script>
