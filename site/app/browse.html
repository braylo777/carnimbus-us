<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Browse</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
.opt{font:600 12px Manrope;color:#cbd5e1;border:1px solid rgba(24,200,255,.25);border-radius:999px;padding:9px 14px;cursor:pointer;background:transparent}
.opt.on{background:rgba(24,200,255,.16);color:#18C8FF;border-color:#18C8FF}
@media(max-width:700px){.app-rail{display:none!important}.app-split{flex-direction:column!important}.app-split>*{border-right:none!important}}
</style>
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:600px">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z row" style="min-height:548px">
      <div class="col app-rail" style="width:172px;border-right:1px solid rgba(24,200,255,.12);padding:16px;gap:15px">
        <div style="font:700 11px Manrope">Filters</div>
        <div><div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:8px">BODY</div>
          <div class="row" id="bodychips" style="flex-wrap:wrap;gap:6px">
            <button type="button" class="opt on" data-v="All" style="padding:4px 9px;font-size:10px">All</button>
            <button type="button" class="opt" data-v="Sedan" style="padding:4px 9px;font-size:10px">Sedan</button>
            <button type="button" class="opt" data-v="SUV" style="padding:4px 9px;font-size:10px">SUV</button>
            <button type="button" class="opt" data-v="EV" style="padding:4px 9px;font-size:10px">EV</button>
          </div></div>
        <div><div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:8px">MONTHLY</div>
          <label class="vh" for="mo-range">Max monthly payment</label>
          <input type="range" id="mo-range" min="200" max="800" step="10" value="800" style="width:100%;accent-color:#18C8FF">
          <div id="mo-label" style="font:600 10px Manrope;color:#aebfdf;margin-top:7px">$200 – $800/mo</div></div>
        <div><div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:8px">MAKE</div>
          <div class="col" id="makes" style="gap:7px;align-items:flex-start"></div></div>
      </div>
      <div style="flex:1;padding:16px;min-width:0">
        <div class="row" style="align-items:center;gap:10px;margin-bottom:14px">
          <label class="vh" for="q">Search inventory</label>
          <input id="q" class="pill" style="flex:1;height:44px" placeholder="Search make, model, ZIP">
          <span class="mono" id="count" style="font:600 10px Manrope;color:#8ca0c4">…</span>
        </div>
        <div id="anon-cta" style="display:none;align-items:center;gap:10px;margin-bottom:12px;padding:11px 14px;border:1px dashed rgba(24,200,255,.35);border-radius:12px;font:600 12px Manrope;color:#aebfdf">Answer 10 quick questions to unlock ranked matches. <a class="cy" href="/app/signin.html">Sign in →</a></div>
        <div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
  var CARS=[],F={body:"All",maxMo:800,makes:{},q:""};
  var grid=document.getElementById("grid"),count=document.getElementById("count");
  function card(c){return '<a class="glass vcard hoverable" href="/app/car.html?id='+c.id+'" style="text-decoration:none;display:block">'+
    '<div class="vphoto">'+(c.photos&&c.photos[0]?'<img src="'+c.photos[0]+'" alt="'+c.year+' '+c.make+' '+c.model+'" loading="lazy" onerror="this.remove()">':'')+
    '<span class="vbadge cert">Certified</span>'+(c.match!=null?'<span class="vbadge best">'+c.match+'% match</span>':'')+'</div>'+
    '<div class="vbody"><h4>'+c.year+' '+c.make+' '+c.model+'</h4><div class="vtrim">'+(c.trim||'&nbsp;')+'</div>'+
    '<div class="row vmeta"><span>'+c.miles+' mi</span><span>'+c.drivetrain+'</span></div>'+
    '<div class="row vprice"><b>$'+c.price_mo+'<small>/mo</small></b><span class="vcta">Talk to this car →</span></div></div></a>';}
  function render(){var out=CARS.filter(function(c){
      if(F.body!=="All"&&(c.body||"").toLowerCase()!==F.body.toLowerCase())return false;
      if(c.price_mo>F.maxMo)return false;
      if(Object.keys(F.makes).length&&!F.makes[c.make])return false;
      if(F.q&&((c.year+' '+c.make+' '+c.model+' '+(c.trim||'')).toLowerCase().indexOf(F.q)<0))return false;
      return true;});
    grid.innerHTML=out.map(card).join('')||'<div style="grid-column:1/-1;text-align:center;font:600 12px Manrope;color:#aebfdf;padding:30px">No cars match those filters.</div>';
    count.textContent=out.length+" matches";}
  fetch("/api/feed").then(function(r){return r.json();}).then(function(d){
    if(!d.ok)throw 0; CARS=d.cars;
    var mk=document.getElementById("makes");
    CARS.map(function(c){return c.make;}).filter(function(v,i,a){return a.indexOf(v)===i;}).forEach(function(m){
      var b=document.createElement("button");b.type="button";b.className="opt";b.style.cssText="padding:4px 9px;font-size:10px";b.textContent=m;
      b.addEventListener("click",function(){b.classList.toggle("on");if(b.classList.contains("on"))F.makes[m]=1;else delete F.makes[m];render();});
      mk.appendChild(b);});
    if(d.authed===false){document.getElementById("anon-cta").style.display="flex";}
    render();
  }).catch(function(){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;font:600 12px Manrope;color:#aebfdf;padding:30px">Feed unavailable — refresh to retry.</div>';});
  document.querySelectorAll("#bodychips .opt").forEach(function(b){b.addEventListener("click",function(){
    document.querySelectorAll("#bodychips .opt").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");F.body=b.dataset.v;render();});});
  var rng=document.getElementById("mo-range"),lab=document.getElementById("mo-label");
  rng.addEventListener("input",function(){F.maxMo=+rng.value;lab.textContent="$200 – $"+rng.value+"/mo";render();});
  document.getElementById("q").addEventListener("input",function(e){F.q=e.target.value.trim().toLowerCase();render();});
});
</script>
</body>
</html>
