<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — You</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
@media(max-width:700px){.app-rail{display:none!important}.app-split{flex-direction:column!important}.app-split>*{border-right:none!important}}
</style>
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:600px">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z" style="min-height:548px;padding:16px">
      <div id="gate" style="display:none;text-align:center;padding:60px 20px"><div class="disp" style="font-size:20px">Sign in to see your account.</div><a class="btn primary md" href="/app/signin.html" style="text-decoration:none;margin-top:14px;display:inline-flex">Sign in</a></div>
      <div id="acct" style="display:none">
        <div class="row" style="align-items:center;gap:12px">
          <span class="avatar" id="y-av" style="width:46px;height:46px;font-size:15px">·</span>
          <div><div class="disp" id="y-phone" style="font-size:17px;font-weight:600"></div><div style="margin-top:3px"><span class="cidtag">CarNimbus rider</span></div></div>
        </div>
        <div id="y-up" style="display:none;margin-top:16px"><div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:8px">UPCOMING</div>
          <div class="glass pd">
            <div class="row" style="align-items:center;justify-content:space-between"><div id="y-veh" style="font:700 12px Manrope"></div><span class="statuspill" id="y-status" style="background:rgba(31,138,91,.16);color:#5ee6a8"></span></div>
            <div class="row" style="align-items:center;gap:7px;margin-top:9px;font:500 11px Manrope;color:#aebfdf"><span class="ic-sm cy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span><span id="y-center"></span></div>
            <div class="row" style="align-items:center;gap:7px;margin-top:6px;font:500 11px Manrope;color:#aebfdf"><span class="ic-sm cy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span><span id="y-slot"></span></div>
            <div class="row" style="gap:8px;margin-top:13px"><a class="btn primary sm" id="y-pass" style="text-decoration:none">Open pass</a><a class="btn ghost sm" id="y-chat" style="text-decoration:none">Reschedule</a></div>
          </div>
        </div>
        <div style="margin-top:16px"><div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:4px">YOUR MATCHES</div><div id="y-matches"></div></div>
        <div class="col" style="gap:10px;margin-top:18px">
          <a class="btn ghost md" href="/app/profile.html" style="text-decoration:none">Edit my 10 answers</a>
          <button class="btn ghost md" id="y-out" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/you.js" defer></script>
</body>
</html>
