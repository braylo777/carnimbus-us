<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Chat</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:calc(100dvh - 96px);display:flex;flex-direction:column">
    <div class="cine"><div class="cine-grid"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:14px">
      <div id="chat-empty" style="display:none;flex-direction:column;gap:12px;align-items:center">
        <div class="disp" style="font-size:20px;font-weight:700;color:#fff">No chats yet</div>
        <div style="font:600 13px Manrope;color:#aebfdf;max-width:280px">Find a car in your feed and tap “Talk to this car” to start a conversation.</div>
        <a href="https://app.carnimbus.com/feed" class="btn primary md" style="text-decoration:none">Go to feed →</a>
      </div>
      <div id="chat-load" style="font:600 13px Manrope;color:#8ca0c4">Opening your chat…</div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/chat-redirect.js" defer></script>
</body>
</html>
