<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Your Top Matches</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:calc(100vh - 96px);display:flex;flex-direction:column">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z row app-split" style="flex:1;min-height:0" id="m-split">
      <div id="m-list" style="flex:none;width:340px;max-width:42%;border-right:1px solid rgba(24,200,255,.12);overflow-y:auto;padding:16px;min-height:0">
        <div id="m-gate" style="display:none;align-items:center;gap:10px;margin-bottom:12px;padding:11px 14px;border:1px dashed rgba(24,200,255,.35);border-radius:12px;font:600 12px Manrope;color:#aebfdf">Finish your profile to unlock matches. <a class="cy" href="/edit-profile">Answer a few questions →</a></div>
        <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin-bottom:9px">NEW MATCHES</div>
        <div id="m-new" class="row" style="gap:10px;overflow-x:auto;padding-bottom:6px"></div>
        <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin:16px 0 9px">CONVERSATIONS</div>
        <div id="m-threads" class="col" style="gap:8px"></div>
      </div>
      <div id="m-chat" class="col" style="flex:1;min-width:0;min-height:0">
        <div id="m-empty" class="col" style="flex:1;align-items:center;justify-content:center;text-align:center;padding:30px;gap:8px;color:#8ca0c4">
          <div class="disp" style="font-size:16px;color:#e2e9f2">Pick a match to start talking.</div>
          <div style="font:500 12px Manrope">Nimbus threads through every conversation — pick up any car where you left off.</div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js?v=2" defer></script>
<script src="/assets/js/matches.js?v=2" defer></script>
</body>
</html>
