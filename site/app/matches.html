<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Your Top Matches</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:calc(100vh - 96px);display:flex;flex-direction:column">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z" style="flex:1;min-height:0;padding:18px">
      <div style="margin-bottom:14px"><div class="disp" style="font-size:22px">Nimbus found your top matches.</div>
        <div style="font:500 12px Manrope;color:#8ca0c4;margin-top:3px">Ranked to your profile. Tap any car to talk to it — then pick the one you want to drive.</div></div>
      <div id="m-gate" style="display:none;align-items:center;gap:10px;margin-bottom:12px;padding:11px 14px;border:1px dashed rgba(24,200,255,.35);border-radius:12px;font:600 12px Manrope;color:#aebfdf">Finish your profile to unlock ranked matches. <a class="cy" href="/profile">Answer a few questions →</a></div>
      <div id="grid" style="display:grid;grid-template-columns:1fr;gap:14px;max-width:560px"></div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/matches.js" defer></script>
</body>
</html>
