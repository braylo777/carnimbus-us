<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Discover</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
@media(max-width:700px){.app-rail{display:none!important}.app-split{flex-direction:column!important}.app-split>*{border-right:none!important}}
</style>
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:600px">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" id="appnav" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"></div>
    <div class="z" id="disc" style="position:relative;min-height:548px;overflow:hidden">
      <div id="d-empty" style="display:none;position:absolute;inset:0;place-items:center;font:700 15px Manrope;color:#aebfdf;text-align:center;padding:40px;z-index:6;cursor:pointer"></div>
      <div class="row" style="justify-content:space-between;align-items:center;padding:12px 16px 0;position:relative;z-index:3">
        <div class="row" style="gap:14px;font:700 13px Manrope"><span style="opacity:.55">Following</span><span style="border-bottom:2px solid #18C8FF;padding-bottom:3px">For You</span></div>
        <a class="cy" href="/app/browse.html" aria-label="Search and browse all cars" style="font:700 13px Manrope">Browse all 🔍</a>
      </div>
      <img id="d-img" src="" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,28,.55) 0%,transparent 30%,transparent 45%,rgba(4,10,28,.9) 100%)"></div>
      <div style="position:absolute;right:12px;bottom:150px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3">
        <div style="text-align:center"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.5C7 16.5 3 13.4 3 9.5A4.5 4.5 0 0 1 7.5 5c1.8 0 3.4 1 4.5 2.5C13.1 6 14.7 5 16.5 5A4.5 4.5 0 0 1 21 9.5c0 3.9-4 7-9 11Z"/></svg></div><div id="d-likes" style="font:700 9px Manrope;margin-top:2px"></div></div>
        <div style="text-align:center"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></div><div id="d-match" style="font:700 9px Manrope;margin-top:2px"></div></div>
      </div>
      <div style="position:absolute;left:14px;right:14px;bottom:16px;z-index:3;background:rgba(6,16,40,.82);border:1px solid rgba(24,200,255,.3);border-radius:14px;padding:10px;backdrop-filter:blur(10px)">
        <div class="row" style="align-items:center;gap:9px">
          <span style="width:42px;height:30px;border-radius:7px;overflow:hidden;flex:none"><img id="d-thumb" src="" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"></span>
          <div style="flex:1;min-width:0"><div id="d-title" style="font:700 11px Manrope"></div><div class="row" style="gap:5px;margin-top:3px;font:700 7px Manrope"><span style="color:#54d699">✓ Good price</span><span style="color:#54d699">✓ Trusted indie dealer</span></div></div>
          <a id="d-talk" class="btn primary sm" style="text-decoration:none">Talk to it</a>
        </div>
      </div>
      <button id="d-prev" class="btn ghost sm" style="position:absolute;left:10px;top:50%;z-index:3">‹</button>
      <button id="d-next" class="btn ghost sm" style="position:absolute;right:10px;top:50%;z-index:3">›</button>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/discover.js" defer></script>
</body>
</html>
