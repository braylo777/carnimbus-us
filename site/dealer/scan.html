<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>Dealer — Scan pass</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:600px;padding:22px">
    <div class="cine"><div class="cine-grid"></div></div>
    <div class="z row" style="align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="disp" style="font-size:22px;font-weight:700">Scan the rider's pass</div>
      <a href="/dealer/console" class="btn ghost sm" style="text-decoration:none">‹ Back</a>
    </div>
    <div class="z" id="s-live" style="max-width:430px;margin:0 auto">
      <div style="position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(24,200,255,.35)">
        <video id="cam" muted style="width:100%;display:block;background:#04102a;min-height:320px"></video>
        <div style="position:absolute;inset:14%;border:2px solid rgba(24,200,255,.7);border-radius:16px;pointer-events:none"></div>
      </div>
      <div style="text-align:center;font:600 12px Manrope;color:#aebfdf;margin-top:10px">Point at the rider's Drive Now Pass.</div>
    </div>
    <div class="z" style="max-width:430px;margin:14px auto 0">
      <div class="wl-msg" id="s-msg" style="display:none"></div>
      <div class="row" style="gap:9px;margin-top:10px">
        <label class="vh" for="s-code">Desk code</label>
        <input id="s-code" class="field" placeholder="Desk code (6 characters)" style="flex:1;text-transform:uppercase" maxlength="8">
        <button id="s-go" class="btn primary md" type="button">Check in</button>
      </div>
    </div>
    <div class="z" id="s-ok" style="display:none;text-align:center;padding:50px 20px">
      <div class="wl-done" style="max-width:340px;margin:0 auto"><div class="wl-done-h" id="s-who"></div><div class="wl-done-p">Console updating…</div></div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/vendor/jsqr.js" defer></script>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/scan.js" defer></script>
</body>
</html>
