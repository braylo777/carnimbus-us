    <div class="z row" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12);gap:16px"><a href="https://dealer.carnimbus.com/" style="text-decoration:none;color:#8ca0c4;font:600 12px Manrope">‹ Back</a></div>
    <div class="z" style="flex:1;width:100%;max-width:460px;margin:0 auto;padding:24px 20px;color:#e2e9f2;display:flex;flex-direction:column;justify-content:center">
      <div class="col" style="align-items:center;gap:7px;margin:6px 0 4px"><img src="/assets/logo.png" style="width:64px;height:64px;filter:drop-shadow(0 0 24px rgba(24,200,255,.55))" alt=""><div class="disp" style="font-size:22px">CarNimbus <span class="cy">for Dealers</span></div></div>

        <div class="wl-msg" id="au-msg" style="display:none"></div>

      <div style="margin-top:16px;font:500 12px Manrope;color:#8ca0c4">Not a partner yet? <a class="cy" href="https://calendar.app.google/f4takf46LRZSxFMr6" target="_blank" rel="noopener">Book A Live Demo →</a></div>
