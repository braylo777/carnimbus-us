<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus for Dealers — Partner sign in</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="stage">
<div style="padding:0 20px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:100dvh;display:flex;flex-direction:column">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:300px;height:300px;background:rgba(24,200,255,.12);top:-80px;right:-40px"></div><div class="cine-vig"></div></div>
    <div class="z row" style="height:52px;align-items:center;padding:0 18px;border-bottom:1px solid rgba(24,200,255,.12)"><div class="disp" style="font-size:15px">CarNimbus <span class="cy">for Dealers</span></div></div>
    <div class="z" style="flex:1;width:100%;max-width:440px;margin:0 auto;padding:24px 20px;color:#e2e9f2;display:flex;flex-direction:column;justify-content:center">
      <div class="col" style="align-items:center;gap:9px;margin:6px 0 10px"><img src="/assets/logo.png" style="width:64px;height:64px;filter:drop-shadow(0 0 24px rgba(24,200,255,.55))" alt=""></div>
      <div style="font:600 16px/1.5 Manrope;color:#e2e9f2;text-align:center;margin-top:4px">Sign in or create your account.</div>
      <div class="glass pd" style="margin-top:18px;border-radius:18px">
        <label class="vh" for="dl-email">Email</label>
        <input id="dl-email" type="email" class="pill" placeholder="you@yourstore.com" autocomplete="username" inputmode="email">
        <label class="vh" for="dl-pass">Password</label>
        <input id="dl-pass" type="password" class="pill" placeholder="Password (8+ characters)" autocomplete="current-password" style="margin-top:12px">
        <button id="dl-go" class="btn primary md" style="width:100%;margin-top:16px">Log In</button>
        <button id="dl-signup" class="btn ghost md" style="width:100%;margin-top:10px">Create Account</button>
        <div class="wl-msg" id="dl-msg" style="display:none;margin-top:12px"></div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/dealer-login.js" defer></script>
</body>
</html>
