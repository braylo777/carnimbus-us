<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>CarNimbus — Dealer console</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
.opt{font:600 12px Manrope;color:#cbd5e1;border:1px solid rgba(24,200,255,.25);border-radius:999px;padding:9px 14px;cursor:pointer;background:transparent}
.opt.on{background:rgba(24,200,255,.16);color:#18C8FF;border-color:#18C8FF}
@media(max-width:700px){[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:1fr 1fr!important}}
</style>
</head>
<body>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv">
  <div style="position:relative;background:#06163b;min-height:640px">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:420px;height:420px;background:rgba(24,200,255,.1);top:-80px;right:-60px"></div><div class="cine-vig"></div></div>
    <div class="z row" style="align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid rgba(24,200,255,.12)">
      <a href="/" style="display:inline-flex;align-items:center;gap:8px"><img src="/assets/logo.png" alt="" style="width:26px;height:26px"><b style="font:700 14px 'Space Grotesk';color:#fff">CarNimbus</b></a>
      <span id="dc-store" style="font:600 12px Manrope;color:#8ca0c4;border-left:1px solid rgba(24,200,255,.18);padding-left:16px">Console</span>
      <span id="dc-cn" class="mono" style="font-size:9px;color:#7f93b8"></span>
      <div class="row" style="margin-left:auto;align-items:center;gap:12px">
        <a class="btn primary sm" href="/dealer/listing.html" style="text-decoration:none">+ New listing</a>
        <span id="dc-name" style="font:700 12px Manrope"></span>
      </div>
    </div>
    <div class="z" style="padding:18px 20px">
      <div id="gate401" style="display:none;text-align:center;padding:60px 20px"><div class="disp" style="font-size:20px">Sign in with your dealer number.</div><a class="btn primary md" href="/app/signin.html" style="text-decoration:none;margin-top:14px;display:inline-flex">Sign in</a></div>
      <div id="gate403" style="display:none;text-align:center;padding:60px 20px"><div class="disp" style="font-size:20px">Your access is pending.</div><div style="font:500 13px Manrope;color:#aebfdf;margin-top:6px">Your client number unlocks this console the moment your partnership is active.</div><a class="btn primary md" href="/app/signin.html" style="text-decoration:none;margin-top:14px;display:inline-flex">Request access</a></div>
      <div id="console" style="display:none">
        <div class="row" style="align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="disp" style="font-size:26px;font-weight:700">Dashboard</div></div>
        <div id="do-now" class="row" style="display:none;align-items:center;gap:12px;background:rgba(24,200,255,.08);border:1px solid rgba(24,200,255,.28);border-radius:14px;padding:12px 16px;margin-top:12px">
          <span style="width:34px;height:34px;border-radius:11px;background:rgba(24,200,255,.16);display:grid;place-items:center;color:#18C8FF" class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>
          <div id="dn-txt" style="font:700 14px Manrope;color:#fff"></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px">
          <div class="metric"><div class="v" id="k-routed">0</div><div class="l">Routed</div></div>
          <div class="metric"><div class="v" id="k-booked">0</div><div class="l">Booked</div></div>
          <div class="metric"><div class="v" id="k-showed">0</div><div class="l">Showed</div></div>
          <div class="metric"><div class="v" id="k-closed">0</div><div class="l">Closed</div></div>
        </div>
        <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin:16px 0 8px">APPOINTMENTS · ADVANCE ON ARRIVAL</div>
        <div id="appts" class="col" style="gap:10px"></div>
        <div class="mono" style="font-size:9px;color:#8ca0c4;letter-spacing:.1em;margin:16px 0 4px">YOUR LISTINGS</div>
        <div id="lst"></div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script src="/assets/signals.js" defer></script>
<script src="/assets/runtime.js" defer></script>
<script src="/assets/js/dealer-console.js" defer></script>
</body>
</html>
