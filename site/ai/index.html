<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>NIMBUS</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
@keyframes corepulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.aistage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0a2050 0%,#06163b 55%,#040d24 100%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.core{position:relative;width:min(30vmin,260px);height:min(30vmin,260px);border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(24,200,255,.95),rgba(11,99,229,.55) 45%,rgba(11,99,229,.08) 72%);box-shadow:0 0 120px rgba(24,200,255,.45),0 0 300px rgba(11,99,229,.3);animation:corepulse 5s ease-in-out infinite}
.ringlab{position:absolute;font:700 10px Manrope;letter-spacing:.18em;color:#8ca0c4;background:rgba(6,16,40,.75);border:1px solid rgba(24,200,255,.25);border-radius:99px;padding:5px 11px;white-space:nowrap;z-index:2}
.tick{display:flex;gap:2vw;margin-top:5vh;position:relative;z-index:2;flex-wrap:wrap;justify-content:center}
.tick .t{backdrop-filter:blur(12px);background:rgba(255,255,255,.04);border:1px solid rgba(24,200,255,.2);border-radius:16px;padding:14px 22px;text-align:center}
.tick .tv{font:700 clamp(22px,3vw,42px) 'Space Grotesk';color:#18C8FF}
.tick .tl{font:700 9px Manrope;color:#8ca0c4;letter-spacing:.2em;margin-top:4px}
</style>
</head>
<body>
<div class="aistage">
  <canvas id="orbit" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <div class="core"></div>
  <span class="ringlab" style="top:16%;left:14%">INFERENCE · GLM-5.2 · 1TB DDR5</span>
  <span class="ringlab" style="top:22%;right:12%">VECTOR STORE · CARNIMBUS-MATCH</span>
  <span class="ringlab" style="bottom:26%;left:18%">RELATIONAL · SQLITE</span>
  <div class="disp" style="font-size:2.6vw;letter-spacing:.34em;margin-top:3vh;position:relative;z-index:2">N I M B U S</div>
  <div class="tick">
    <div class="t"><div class="tv" id="ai-cars">–</div><div class="tl">CARS LIVE</div></div>
    <div class="t"><div class="tv" id="ai-riders">–</div><div class="tl">RIDERS</div></div>
    <div class="t"><div class="tv" id="ai-drives">–</div><div class="tl">DRIVES BOOKED</div></div>
    <div class="t"><div class="tv" id="ai-embeddings">–</div><div class="tl">EMBEDDINGS</div></div>
    <div class="t"><div class="tv" id="ai-chats">–</div><div class="tl">CONVERSATIONS</div></div>
  </div>
  <div class="mono" style="font-size:10px;color:#7f93b8;letter-spacing:.3em;margin-top:4vh;position:relative;z-index:2">NIMBUS · ONLINE · PROJECTED FROM CLOUDFLARE EDGE · AWAITING HARDWARE CUTOVER</div>
</div>
<script src="/assets/js/nimbus.js" defer></script>
</body>
</html>
