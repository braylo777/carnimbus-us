<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#06163b">
<title>NIMBUS — Pools</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/styles.css">
<style>
body{background:#040b1e;color:#e2e9f2}
.pw2{max-width:1100px;margin:0 auto;padding:28px 20px}
.pw2 h1{font:700 20px 'Space Grotesk';letter-spacing:.08em}
.ptab{font:700 11px 'IBM Plex Mono';letter-spacing:.12em;color:#8ca0c4;background:transparent;border:1px solid rgba(24,200,255,.25);border-radius:999px;padding:8px 16px;cursor:pointer}
.ptab.on{color:#18C8FF;border-color:#18C8FF;background:rgba(24,200,255,.12)}
.pbtn{font:600 11px Manrope;color:#cbd5e1;background:transparent;border:1px solid rgba(24,200,255,.3);border-radius:10px;padding:8px 14px;cursor:pointer}
.pbtn:hover{color:#18C8FF;border-color:#18C8FF}
.ptable-wrap{overflow-x:auto;border:1px solid rgba(24,200,255,.15);border-radius:12px;margin-top:14px}
#pool-table{width:100%;border-collapse:collapse;font:500 11px 'IBM Plex Mono'}
#pool-table th{font:700 9px 'IBM Plex Mono';letter-spacing:.12em;color:#18C8FF;text-align:left;padding:9px 10px;border-bottom:1px solid rgba(24,200,255,.2);text-transform:uppercase}
#pool-table td{padding:7px 10px;border-bottom:1px solid rgba(24,200,255,.07);color:#aebfdf;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<main class="pw2">
  <div class="row" style="align-items:center;gap:12px;flex-wrap:wrap">
    <h1 style="flex:1">NIMBUS · POOLS</h1>
    <label class="vh" for="pk">Admin key</label>
    <input id="pk" type="password" class="pill" placeholder="admin key" style="width:180px;height:38px">
    <a class="cy" href="/" style="font:700 11px Manrope;text-decoration:none">← CORE</a>
  </div>
  <div class="row" style="gap:8px;margin:18px 0 4px;flex-wrap:wrap;align-items:center">
    <button class="ptab on" type="button" data-pool="buyers">BUYERS</button>
    <button class="ptab" type="button" data-pool="vdps">VDPS</button>
    <span id="p-count" style="font:600 11px Manrope;color:#8ca0c4;margin-left:6px"></span>
    <span style="flex:1"></span>
    <button id="up-buyers" class="pbtn" type="button">⇧ Upload buyers CSV</button>
    <button id="up-vdps" class="pbtn" type="button">⇧ Upload VDPs CSV</button>
    <button id="dl-buyers" class="pbtn" type="button">⇩ buyers.csv</button>
    <button id="dl-vdps" class="pbtn" type="button">⇩ vdps.csv</button>
    <button id="reindex" class="pbtn" type="button" style="color:#18C8FF;border-color:#18C8FF">⟳ Reindex</button>
    <input id="up-buyers-file" type="file" accept=".csv" style="display:none">
    <input id="up-vdps-file" type="file" accept=".csv" style="display:none">
  </div>
  <div id="p-msg" style="display:none;font:600 11px Manrope;color:#18C8FF;margin:8px 0"></div>
  <div class="ptable-wrap"><table id="pool-table"></table></div>
</main>
<script src="/assets/js/pools.js" defer></script>
</body>
</html>
