<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nimbus — Growth</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
body{background:#050e26;color:#e2e9f2;font-family:Manrope,system-ui,sans-serif;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px}
h1{font:700 20px 'Space Grotesk',Manrope;color:#fff;margin:0 0 2px}
.sub{font:600 11px Manrope;color:#8ca0c4;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;margin:16px 0}
input{flex:1;background:#0a1f4d;border:1px solid rgba(24,200,255,.25);border-radius:10px;color:#fff;padding:10px 12px;font:600 12px Manrope}
button{background:#18C8FF;border:none;border-radius:10px;color:#041022;font:700 12px Manrope;padding:10px 16px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:8px}
.tile{background:#0a1f4d;border:1px solid rgba(24,200,255,.12);border-radius:14px;padding:14px}
.tile .v{font:700 26px 'Space Grotesk',Manrope;color:#18C8FF}
.tile .l{font:700 9px Manrope;color:#8ca0c4;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.bar{height:10px;background:#18C8FF;border-radius:6px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0;font:600 11px Manrope}
.brow .k{width:130px;color:#aebfdf}
.live{font:700 10px Manrope;color:#5ee6a8}
</style>
</head>
<body>
<div class="wrap">
  <h1>Nimbus Growth</h1>
  <div class="sub">Weekly funnel · <span id="status" class="live">enter key</span></div>
  <div class="row"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="go">Load</button></div>
  <div class="tiles" id="tiles"></div>
  <div class="sub" style="margin-top:20px">Events by category (7d)</div>
  <div id="bars"></div>
</div>
<script src="/assets/js/admin-growth.js" defer></script>
</body>
</html>
