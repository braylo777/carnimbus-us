<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nimbus — Event Stream</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
body{background:#050e26;color:#e2e9f2;font-family:Manrope,system-ui,sans-serif;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px}
h1{font:700 20px 'Space Grotesk',Manrope;color:#fff;margin:0 0 2px}
.sub{font:600 11px Manrope;color:#8ca0c4;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;margin:16px 0}
input{flex:1;background:#0a1f4d;border:1px solid rgba(24,200,255,.25);border-radius:10px;color:#fff;padding:10px 12px;font:600 12px Manrope}
button{background:#18C8FF;border:none;border-radius:10px;color:#041022;font:700 12px Manrope;padding:10px 16px;cursor:pointer}
table{width:100%;border-collapse:collapse;font:500 12px Manrope}
th{text-align:left;font:700 9px Manrope;letter-spacing:.1em;color:#8ca0c4;padding:8px 10px;border-bottom:1px solid rgba(24,200,255,.15)}
td{padding:7px 10px;border-bottom:1px solid rgba(24,200,255,.06);white-space:nowrap}
.pfx{font:700 10px Manrope;padding:1px 7px;border-radius:6px}
.live{font:700 10px Manrope;color:#5ee6a8}
.mono{font-family:ui-monospace,Menlo,monospace;color:#aebfdf}
</style>
</head>
<body>
<div class="wrap">
  <h1>Nimbus Event Stream</h1>
  <div class="sub">The brain's first heartbeat · <span id="status" class="live">connecting…</span></div>
  <div class="row"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="go">Watch</button></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Time</th><th>Action</th><th>ID</th><th>Vehicle</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script src="/assets/js/admin-events.js" defer></script>
</body>
</html>
