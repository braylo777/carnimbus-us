<body>
<noscript><div style="max-width:640px;margin:0 auto;padding:40px 24px;font-family:system-ui,sans-serif;color:#e2e9f2;background:#06163b;text-align:center"><h1 style="font-size:26px">Be first in line.</h1><p>Join the CarNimbus waitlist — email <a style="color:#18C8FF" href="mailto:hello@carnimbus.com">hello@carnimbus.com</a> and we'll add you.</p></div></noscript>
<main class="stage">
<div style="padding:0 20px 40px"><div class="bw cv" data-screen-label="Waitlist">
  <div style="position:relative;background:#06163b;min-height:600px">
    <div class="cine"><div class="cine-grid"></div><div class="glow" style="width:420px;height:420px;background:rgba(24,200,255,.16);top:-120px;left:50%;transform:translateX(-50%)"></div></div>

    <!-- nav -->
    <div class="z row" style="height:64px;align-items:center;padding:0 30px;border-bottom:1px solid rgba(24,200,255,.12);background:rgba(6,16,40,.55);backdrop-filter:blur(18px)">
      <x-import component-from-global-scope="CarNimbusDesignSystem_303dd7.Wordmark" variant="solid" size="19" mark="true"></x-import>
      <div class="row" style="gap:28px;margin-left:36px"><a class="navlink" href="/#how-it-works">How it works</a><a class="navlink" href="/browse">Browse</a></div>
      <div class="row" style="margin-left:auto;align-items:center;gap:14px">
        <x-import component-from-global-scope="CarNimbusDesignSystem_303dd7.SegmentedControl"></x-import>
      </div>
    </div>

    <!-- hero form -->
    <div class="z col" style="align-items:center;text-align:center;padding:78px 30px 60px;gap:15px">
      <x-import component-from-global-scope="CarNimbusDesignSystem_303dd7.Eyebrow">Early access</x-import>
      <h1 class="hero-h1" style="font-size:clamp(34px,5vw,52px)">Be first in line.</h1>
      <div style="font:500 15px/1.5 Manrope;color:#aebfdf;max-width:440px">Join the waitlist and we'll text you the day CarNimbus is ready to use.</div>
      <form class="wl-form" data-src="waitlist" style="width:100%;max-width:440px;margin-top:10px">
        <div style="display:flex;gap:9px">
          <label class="vh" for="wl-email-page">Email address</label>
          <input id="wl-email-page" type="email" class="pill" required placeholder="you@email.com" style="flex:1">
          <button type="submit" class="btn primary lg">Join Waitlist</button>
        </div>
        <label class="consent" style="justify-content:center"><input type="checkbox" class="wl-consent" required> I agree to the <a href="/privacy">Privacy&nbsp;Policy</a> and to receive email/SMS updates — reply STOP to opt out.</label>
        <!-- <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITEKEY"></div> -->
      </form>
      <div class="row" style="align-items:center;gap:8px;font:600 12px Manrope;color:#9fb4dd;margin-top:2px">
        <span class="ic-sm cy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>No spam. One text when we launch.
      </div>
    </div>
  </div>
</div></div>
